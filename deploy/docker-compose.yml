# Usage (laptop):  docker compose --env-file deploy/versions.env -f deploy/docker-compose.yml --profile laptop up -d --build
services:
  presidio-analyzer:
    build:
      context: ../sidecars/presidio
      args:
        PRESIDIO_ANALYZER_DIGEST: ${PRESIDIO_ANALYZER_DIGEST}
        SPACY_MODEL_VERSION: ${SPACY_MODEL_VERSION}
    image: zsan/presidio-analyzer:${SPACY_MODEL_VERSION}-${PRESIDIO_ANALYZER_VERSION}
    profiles: [laptop, vm]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:3000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4g

  gliner:
    build:
      context: ../sidecars/gliner
      args:
        PYTHON_SLIM_DIGEST: ${PYTHON_SLIM_DIGEST}
        GLINER_MODEL_ID: ${GLINER_MODEL_ID}
        GLINER_MODEL_REVISION: ${GLINER_MODEL_REVISION}
    image: zsan/gliner:${GLINER_VERSION}-${GLINER_MODEL_REVISION}
    profiles: [laptop, vm]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5003:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  # presidio-analyzer and gliner above bind to 127.0.0.1 on the host even under the vm
  # profile — that's fine on the VM too, since only the proxy container talks to them
  # (over the compose network) and Caddy is the only service that needs a public port.
  proxy:
    build:
      context: ..
      dockerfile: sidecars/proxy/Dockerfile
    image: zsan/proxy:dev
    profiles: [vm]
    restart: unless-stopped
    env_file:
      - ${ZSAN_ENV_FILE:-/opt/zsan/.env}
    environment:
      ZSAN_TRANSPORT: http
      ZSAN_HTTP_PORT: "8080"
      ZSAN_PRESIDIO_URL: http://presidio-analyzer:3000
      ZSAN_GLINER_URL: http://gliner:8000
      ZSAN_UPSTREAM_COMMAND: zendesk-mcp
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      gliner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r=await fetch('http://localhost:8080/healthz'); if(!r.ok) process.exit(1)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    profiles: [vm]
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - proxy

volumes:
  caddy-data: {}
